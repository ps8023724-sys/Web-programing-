<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Click Counter</title>

  <style>
    body {
      font-family: system-ui;
      padding: 24px;
      text-align: center;
    }

    .done {
      background: #16a34a !important;
    }

    #clicker {
      padding: 14px 32px;
      font-size: 18px;
      border: none;
      background: #1a56db;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }

    #count {
      font-size: 32px;
      font-weight: bold;
      margin: 16px 0;
    }

    #message {
      font-size: 16px;
      color: #666;
    }
  </style>
</head>

<body>

  <button id="clicker">Click me!</button>

  <p id="count">0</p>

  <p id="message">Keep clicking...</p>


  <script>
    const btn = document.querySelector("#clicker");
    const countEl = document.querySelector("#count");
    const msg = document.querySelector("#message");

    let count = 0;

    btn.addEventListener("click", function () {
      count++;

      countEl.textContent = count;

      if (count >= 5) {
        btn.classList.add("done");
        msg.textContent = "Congratulations! You reached 5 clicks!";
      }
    });
  </script>

</body>
</html>
