
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E3 - Create Account</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e9e5f7, #d2c6e8);
            color: #40345d;
        }

        .card {
            width: 100%;
            max-width: 460px;
            padding: 38px;
            background: white;
            border-radius: 22px;
            box-shadow: 0 15px 40px rgba(85, 69, 140, 0.15);
        }

        .tag {
            color: #8061ae;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        h1 {
            margin: 14px 0 10px;
            color: #55458c;
            font-size: 30px;
        }

        .description {
            color: #777087;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1dced;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #8061ae;
        }

        input.valid {
            border-color: #36a477;
        }

        input.invalid {
            border-color: #d65c70;
        }

        .feedback {
            min-height: 18px;
            margin-top: 7px;
            font-size: 13px;
        }

        .feedback.error {
            color: #c04459;
        }

        .feedback.success {
            color: #27845e;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #8061ae;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #55458c;
        }

        #result {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        #result.success {
            color: #27845e;
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="tag">WEEK 8-2 · EXERCISE E3</div>

        <h1>Create Your Account</h1>

        <p class="description">
            Choose a secure password and confirm it to complete your registration.
        </p>

        <form id="accountForm">

            <div class="field">
                <label for="password">Create Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 8 characters"
                    minlength="8"
                    required
                    aria-describedby="passwordFeedback"
                >

                <div
                    id="passwordFeedback"
                    class="feedback"
                    aria-live="polite"
                ></div>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Enter password again"
                    required
                    aria-describedby="confirmFeedback"
                >

                <div
                    id="confirmFeedback"
                    class="feedback"
                    aria-live="polite"
                ></div>
            </div>

            <button type="submit">Create Account</button>

            <div id="result" aria-live="polite"></div>

        </form>
    </main>

    <script>
        const form = document.getElementById("accountForm");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");

        const passwordFeedback = document.getElementById("passwordFeedback");
        const confirmFeedback = document.getElementById("confirmFeedback");
        const result = document.getElementById("result");

        function validatePassword() {
            password.setCustomValidity("");

            if (password.value.length > 0 && password.value.length < 8) {
                password.setCustomValidity(
                    "Password must contain at least 8 characters."
                );
                password.classList.add("invalid");
                password.classList.remove("valid");
                passwordFeedback.textContent =
                    "Password must be at least 8 characters.";
                passwordFeedback.className = "feedback error";
            } else if (password.value.length >= 8) {
                password.classList.add("valid");
                password.classList.remove("invalid");
                passwordFeedback.textContent = "Password length looks good!";
                passwordFeedback.className = "feedback success";
            } else {
                password.classList.remove("valid", "invalid");
                passwordFeedback.textContent = "";
                passwordFeedback.className = "feedback";
            }

            validateConfirmation();
        }

        function validateConfirmation() {
            confirmPassword.setCustomValidity("");

            if (confirmPassword.value === "") {
                confirmPassword.classList.remove("valid", "invalid");
                confirmFeedback.textContent = "";
                confirmFeedback.className = "feedback";
            } else if (confirmPassword.value !== password.value) {
                confirmPassword.setCustomValidity(
                    "Passwords do not match."
                );
                confirmPassword.classList.add("invalid");
                confirmPassword.classList.remove("valid");
                confirmFeedback.textContent = "Passwords do not match.";
                confirmFeedback.className = "feedback error";
            } else if (password.value.length >= 8) {
                confirmPassword.classList.add("valid");
                confirmPassword.classList.remove("invalid");
                confirmFeedback.textContent = "Passwords match!";
                confirmFeedback.className = "feedback success";
            } else {
                confirmPassword.classList.remove("valid", "invalid");
                confirmFeedback.textContent = "";
                confirmFeedback.className = "feedback";
            }
        }

        password.addEventListener("input", function() {
            result.textContent = "";
            validatePassword();
        });

        confirmPassword.addEventListener("input", function() {
            result.textContent = "";
            validateConfirmation();
        });

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            validatePassword();
            validateConfirmation();

            if (form.checkValidity()) {
                result.textContent = "Account created successfully!";
                result.className = "success";
            } else {
                form.reportValidity();
            }
        });
    </script>

</body>
</html>
