
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Styles Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8eefe, #f5eaff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(50, 60, 100, 0.12);
        }

        h2 {
            text-align: center;
            color: #344477;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            color: #444;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #7589d5;
        }

        /* Style for valid input */
        input:valid {
            border-color: #45b879;
        }

        /* Style for invalid input after interaction */
        input:invalid:not(:placeholder-shown) {
            border-color: #e36b75;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #536bb5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #3d5399;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Validation Styles Demo</h2>
        <p class="subtitle">Enter your information to check validation.</p>

        <form id="validationForm">

            <label for="email">Email (required)</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password (min 8 chars)</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                minlength="8"
                required
            >

            <label for="age">Age (18–65)</label>
            <input
                type="number"
                id="age"
                placeholder="Enter your age"
                min="18"
                max="65"
                required
            >

            <button type="submit">Check Validation</button>

        </form>

        <p id="message">Complete all fields to continue.</p>
    </div>

    <script>
        const form = document.getElementById("validationForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            if (form.checkValidity()) {
                message.textContent = "✓ All fields are valid!";
                message.style.color = "#239b60";
            } else {
                message.textContent = "Please correct the invalid fields.";
                message.style.color = "#d94b58";
            }
        });
    </script>

</body>
</html>
