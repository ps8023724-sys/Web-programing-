
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e9e4f5, #dce7f7);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 390px;
            padding: 40px 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(60, 50, 100, 0.12);
        }

        h2 {
            text-align: center;
            color: #493b70;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #514a5c;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 22px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .input-field:focus {
            border-color: #8569b5;
            box-shadow: 0 0 0 3px rgba(133, 105, 181, 0.12);
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #777;
        }

        .remember input {
            accent-color: #8061ae;
            cursor: pointer;
        }

        .remember label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #8061ae;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #674991;
            transform: translateY(-2px);
        }

        #message {
            text-align: center;
            font-size: 13px;
            margin-top: 18px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h2>Sign In</h2>
        <p class="subtitle">Welcome back! Please enter your details.</p>

        <form id="loginForm">

            <label for="email">Email Address</label>
            <input
                class="input-field"
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                class="input-field"
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <div class="remember">
                <input type="checkbox" id="remember">
                <label for="remember">Remember me</label>
            </div>

            <button type="submit">Sign In</button>

        </form>

        <p id="message"></p>

    </div>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                document.getElementById("message").textContent =
                    "Sign-in form submitted successfully!";

                document.getElementById("message").style.color =
                    "#299b69";
            });
    </script>

</body>
</html>
