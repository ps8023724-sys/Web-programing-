<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Exercise 1: Shopping Cart Counter
    const initialProducts = [
      { id: 1, name: "Coffee", price: 4500, emoji: "☕" },
      { id: 2, name: "Sandwich", price: 7000, emoji: "🥪" },
      { id: 3, name: "Water", price: 1500, emoji: "💧" }
    ];

    function formatPrice(price) {
      return "₩" + price.toLocaleString("ko-KR");
    }

    function MiniProduct({ product, quantity, onIncrease, onDecrease }) {
      return (
        <div className="mini-product">
          <div className="mini-product-icon">{product.emoji}</div>
          <h3>{product.name}</h3>
          <p>{formatPrice(product.price)}</p>

          <div className="quantity-controls">
            <button
              onClick={() => onDecrease(product.id)}
              aria-label={"Decrease " + product.name}
            >
              −
            </button>

            <span className="quantity-value">{quantity}</span>

            <button
              onClick={() => onIncrease(product.id)}
              aria-label={"Increase " + product.name}
            >
              +
            </button>
          </div>
        </div>
      );
    }

    function ShoppingCartExercise() {
      const [cart, setCart] = useState(
        initialProducts.map(product => ({
          ...product,
          quantity: 0
        }))
      );

      function increaseQuantity(id) {
        setCart(prevCart =>
          prevCart.map(item =>
            item.id === id
              ? { ...item, quantity: item.quantity + 1 }
              : item
          )
        );
      }

      function decreaseQuantity(id) {
        setCart(prevCart =>
          prevCart.map(item =>
            item.id === id
              ? {
                  ...item,
                  quantity: Math.max(0, item.quantity - 1)
                }
              : item
          )
        );
      }

      const total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
      );

      return (
        <section className="exercise-card">
          <div className="exercise-header">
            <div className="exercise-number number-1">01</div>
            <div>
              <h2>Shopping Cart Counter</h2>
              <p>Manage product quantities and calculate the total.</p>
            </div>
          </div>

          <div className="exercise-content">
            <div className="mini-cart">
              {cart.map(product => (
                <MiniProduct
                  key={product.id}
                  product={product}
                  quantity={product.quantity}
                  onIncrease={increaseQuantity}
                  onDecrease={decreaseQuantity}
                />
              ))}
            </div>

            <div className="cart-total">
              <span>Total Price</span>
              <strong>{formatPrice(total)}</strong>
            </div>

            <div className="shopping-link-area">
              <a className="main-button" href="Shopping%20Cart.html">
                Open Shopping Cart →
              </a>
            </div>
          </div>
        </section>
      );
    }

    // Exercise 2: Toggle Visibility
    function ToggleVisibility() {
      const [isVisible, setIsVisible] = useState(false);

      return (
        <section className="exercise-card">
          <div className="exercise-header">
            <div className="exercise-number number-2">02</div>
            <div>
              <h2>Toggle Visibility</h2>
              <p>Show or hide a message using boolean state.</p>
            </div>
          </div>

          <div className="exercise-content">
            <div className="demo-box">
              <button
                className="demo-button"
                onClick={() => setIsVisible(!isVisible)}
              >
                {isVisible ? "Hide Message" : "Show Message"}
              </button>

              {isVisible && (
                <p style={{marginTop: "18px", marginBottom: 0}}>
                  ✿ Hello! Welcome to my Week 12_1 React exercises.
                  This message appears and disappears using useState.
                </p>
              )}

              <div className="status-text">
                Message is currently {isVisible ? "visible" : "hidden"}.
              </div>
            </div>
          </div>
        </section>
      );
    }

    // Exercise 3: Task List
    function TaskList() {
      const [tasks, setTasks] = useState([
        { id: 1, text: "Review React useState" },
        { id: 2, text: "Practice array methods" },
        { id: 3, text: "Finish Week 12_1 assignment" }
      ]);

      const [newTask, setNewTask] = useState("");

      function addTask() {
        const trimmedTask = newTask.trim();

        if (trimmedTask === "") {
          return;
        }

        const task = {
          id: Date.now(),
          text: trimmedTask
        };

        setTasks(prevTasks => [...prevTasks, task]);
        setNewTask("");
      }

      function removeTask(id) {
        setTasks(prevTasks =>
          prevTasks.filter(task => task.id !== id)
        );
      }

      function handleSubmit(event) {
        event.preventDefault();
        addTask();
      }

      return (
        <section className="exercise-card">
          <div className="exercise-header">
            <div className="exercise-number number-3">03</div>
            <div>
              <h2>My Task List</h2>
              <p>Add new tasks and remove completed tasks.</p>
            </div>
          </div>

          <div className="exercise-content">
            <div className="demo-box">
              <form className="task-form" onSubmit={handleSubmit}>
                <input
                  type="text"
                  placeholder="Write a new task..."
                  value={newTask}
                  onChange={event => setNewTask(event.target.value)}
                />

                <button className="demo-button" type="submit">
                  + Add Task
                </button>
              </form>

              {tasks.length === 0 ? (
                <div className="empty-message">
                  No tasks yet. Add something to get started!
                </div>
              ) : (
                <ul className="task-list">
                  {tasks.map(task => (
                    <li key={task.id}>
                      <span>✿ {task.text}</span>
                      <button onClick={() => removeTask(task.id)}>
                        Remove
                      </button>
                    </li>
                  ))}
                </ul>
              )}

              <div className="status-text">
                {tasks.length} {tasks.length === 1 ? "task" : "tasks"} remaining
              </div>
            </div>
          </div>
        </section>
      );
    }

    // Exercise 4: Scoreboard
    function PlayerScore({ name, score, onIncrease, onDecrease, colorClass }) {
      return (
        <div className={"player-card " + colorClass}>
          <h3>{name}</h3>

          <div className="player-score">{score}</div>

          <div className="score-buttons">
            <button onClick={onDecrease}>− 1</button>
            <button onClick={onIncrease}>+ 1</button>
          </div>
        </div>
      );
    }

    function Scoreboard() {
      const [playerOneScore, setPlayerOneScore] = useState(0);
      const [playerTwoScore, setPlayerTwoScore] = useState(0);

      const totalScore = playerOneScore + playerTwoScore;

      return (
        <section className="exercise-card">
          <div className="exercise-header">
            <div className="exercise-number number-4">04</div>
            <div>
              <h2>Scoreboard</h2>
              <p>Pass player scores through props and update the total.</p>
            </div>
          </div>

          <div className="exercise-content">
            <div className="scoreboard">
              <PlayerScore
                name="Player One"
                score={playerOneScore}
                onIncrease={() => setPlayerOneScore(prev => prev + 1)}
                onDecrease={() => setPlayerOneScore(prev => Math.max(0, prev - 1))}
                colorClass="player-one"
              />

              <PlayerScore
                name="Player Two"
                score={playerTwoScore}
                onIncrease={() => setPlayerTwoScore(prev => prev + 1)}
                onDecrease={() => setPlayerTwoScore(prev => Math.max(0, prev - 1))}
                colorClass="player-two"
              />
            </div>

            <div className="score-total">
              <span>Combined Team Score</span>
              <strong>{totalScore}</strong>
            </div>
          </div>
        </section>
      );
    }

    // Exercise 5: Counter with History and Undo
    function CounterHistory() {
      const [count, setCount] = useState(0);
      const [history, setHistory] = useState([0]);

      function updateCount(newCount) {
        setCount(newCount);

        setHistory(prevHistory =>
          [...prevHistory, newCount].slice(-5)
        );
      }

      function increment() {
        updateCount(count + 1);
      }

      function decrement() {
        updateCount(count - 1);
      }

      function undo() {
        if (history.length <= 1) {
          return;
        }

        const previousCount = history[history.length - 2];

        setCount(previousCount);
        setHistory(prevHistory => prevHistory.slice(0, -1));
      }

      function reset() {
        setCount(0);
        setHistory([0]);
      }

      return (
        <section className="exercise-card">
          <div className="exercise-header">
            <div className="exercise-number number-5">05</div>
            <div>
              <h2>Counter with History & Undo</h2>
              <p>Track previous values and return to the last count.</p>
            </div>
          </div>

          <div className="exercise-content">
            <div className="demo-box">
              <div className="counter-display">
                <div className="counter-number">{count}</div>
                <div className="counter-label">CURRENT COUNT</div>

                <div className="counter-buttons">
                  <button className="demo-button" onClick={increment}>
                    + Increase
                  </button>

                  <button className="secondary-button" onClick={decrement}>
                    − Decrease
                  </button>

                  <button
                    className="secondary-button"
                    onClick={undo}
                    disabled={history.length <= 1}
                    style={{
                      opacity: history.length <= 1 ? 0.45 : 1
                    }}
                  >
                    ↶ Undo
                  </button>

                  <button className="secondary-button" onClick={reset}>
                    Reset
                  </button>
                </div>
              </div>

              <div className="history-area">
                <h3>Recent History</h3>

                <div className="history-list">
                  {history.map((value, index) => (
                    <span className="history-item" key={index}>
                      {value}
                    </span>
                  ))}
                </div>

                <div className="status-text">
                  Showing the latest {history.length} values.
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }
