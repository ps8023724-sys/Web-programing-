
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Little Market — A Collection of Good Things</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --cream: #faf5ef;
      --paper: #fffdf9;
      --olive: #bd8278;
      --olive-light: #f4e5e5;
      --rose: #d18b91;
      --plum: #806080;
      --brown: #493b36;
      --muted: #95857f;
      --line: #eadfd8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background:
        radial-gradient(ellipse at 5% 15%, #f1e4db 0, transparent 30%),
        radial-gradient(ellipse at 95% 50%, #f0e4eb 0, transparent 30%),
        var(--cream);
      color: var(--brown);
      font-family: "DM Sans", sans-serif;
      line-height: 1.6;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .announcement {
      background: #806080;
      color: #fffdf8;
      text-align: center;
      padding: 9px 15px;
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    .topbar {
      max-width: 1250px;
      margin: auto;
      padding: 22px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -1px;
      color: var(--brown);
    }

    .logo em {
      color: var(--rose);
      font-weight: 500;
    }

    .logo-caption {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: -3px;
    }

    .cart-label {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 40px;
      padding: 10px 18px;
      font-size: 12px;
      font-weight: 700;
    }

    .cart-label-icon {
      color: var(--plum);
      font-size: 17px;
    }

    .hero {
      max-width: 1250px;
      margin: auto;
      min-height: 340px;
      padding: 72px 20px 65px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before,
    .hero::after {
      content: "❧";
      position: absolute;
      color: #d3a9a7;
      font-size: 110px;
      opacity: .65;
      font-family: Georgia, serif;
      pointer-events: none;
    }

    .hero::before {
      left: 8%;
      top: 65px;
      transform: rotate(-30deg);
    }

    .hero::after {
      right: 8%;
      bottom: 25px;
      transform: rotate(145deg);
    }

    .hero-kicker {
      display: inline-block;
      color: var(--plum);
      font-size: 10px;
      letter-spacing: 4px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(43px, 7vw, 76px);
      font-weight: 500;
      line-height: 1.12;
      letter-spacing: -2px;
    }

    .hero h1 em {
      color: var(--rose);
      font-weight: 500;
    }

    .hero-description {
      color: var(--muted);
      font-size: 14px;
      margin: 18px auto 24px;
      max-width: 430px;
    }

    .hero-decoration {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      color: var(--rose);
      font-size: 13px;
    }

    .hero-decoration::before,
    .hero-decoration::after {
      content: "";
      width: 55px;
      height: 1px;
      background: #d9b8b4;
    }

    .main-container {
      max-width: 1150px;
      width: 90%;
      margin: 0 auto 90px;
    }

    .collection-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
      margin-bottom: 26px;
    }

    .collection-heading h2 {
      font-family: "Cormorant Garamond", serif;
      font-size: 43px;
      font-weight: 600;
      font-style: italic;
      color: var(--plum);
      letter-spacing: -1px;
    }

    .collection-heading p {
      color: var(--muted);
      font-size: 12px;
    }

    .collection-number {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 19px !important;
      color: var(--rose) !important;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 335px;
      gap: 28px;
      align-items: start;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .product-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 5px;
      overflow: hidden;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px #493c3210;
    }

    .product-art {
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .product-art::before {
      content: "";
      position: absolute;
      width: 155px;
      height: 155px;
      border: 1px solid #ffffff80;
      border-radius: 50%;
    }

    .product-art::after {
      content: "";
      position: absolute;
      width: 175px;
      height: 175px;
      border: 1px solid #ffffff70;
      border-radius: 50%;
    }

    .product-emoji {
      position: relative;
      z-index: 1;
      font-size: 83px;
      filter: drop-shadow(0 9px 6px #493c3220);
      transition: transform .3s ease;
    }

    .product-card:hover .product-emoji {
      transform: scale(1.1) rotate(-4deg);
    }

    .coffee-art { background: #eadbd0; }
    .sandwich-art { background: #e5e1d3; }
    .lemon-art { background: #f2e8bf; }
    .pizza-art { background: #efd5c8; }
    .cake-art { background: #e8d5df; }
    .icecream-art { background: #dce4ed; }

    .product-info {
      padding: 19px 19px 20px;
    }

    .product-category {
      color: var(--rose);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .product-info h3 {
      font-family: "Playfair Display", serif;
      font-size: 21px;
      font-weight: 500;
      margin-bottom: 5px;
    }

    .product-description {
      color: var(--muted);
      font-size: 11px;
      min-height: 18px;
      margin-bottom: 16px;
    }

    .product-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .product-price {
      font-size: 14px;
      font-weight: 700;
      color: var(--plum);
    }

    .add-button {
      border: none;
      background: #bd8278;
      color: white;
      border-radius: 3px;
      padding: 10px 13px;
      font-size: 11px;
      font-weight: 700;
      transition: background .2s;
    }

    .add-button:hover {
      background: var(--plum);
    }

    .cart-panel {
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 23px;
      position: sticky;
      top: 20px;
      box-shadow: 0 12px 30px #493c3208;
    }

    .cart-top {
      text-align: center;
      padding-bottom: 17px;
      border-bottom: 1px dashed #d9d0c3;
    }

    .cart-small-label {
      color: var(--rose);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .cart-top h2 {
      font-family: "Playfair Display", serif;
      font-size: 29px;
      font-weight: 500;
      margin: 4px 0;
    }

    .cart-count {
      color: var(--muted);
      font-size: 11px;
    }

    .empty-cart {
      text-align: center;
      padding: 38px 10px;
    }

    .empty-basket {
      font-size: 43px;
      margin-bottom: 13px;
    }

    .empty-cart h3 {
      font-family: "Playfair Display", serif;
      font-size: 20px;
      font-weight: 500;
    }

    .empty-cart p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
    }

    .cart-item {
      padding: 17px 0;
      border-bottom: 1px dashed #e5ded2;
    }

    .cart-item-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 11px;
    }

    .cart-item-name {
      font-size: 12px;
      font-weight: 700;
    }

    .cart-item-price {
      font-size: 12px;
      font-weight: 700;
      color: var(--plum);
      white-space: nowrap;
    }

    .quantity-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity-controls button {
      width: 25px;
      height: 25px;
      border: 1px solid #ddd9cd;
      border-radius: 50%;
      background: transparent;
      color: var(--brown);
      font-size: 14px;
    }

    .quantity-controls button:hover {
      background: var(--olive-light);
      border-color: var(--rose);
    }

    .quantity-number {
      min-width: 13px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }

    .remove-button {
      border: none;
      background: transparent;
      color: var(--rose);
      font-size: 10px;
      text-decoration: underline;
    }

    .summary {
      padding-top: 18px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 11px;
      color: var(--muted);
      font-size: 12px;
    }

    .total-row {
      border-top: 1px solid var(--line);
      padding-top: 17px;
      margin-top: 16px;
      align-items: center;
      color: var(--brown);
    }

    .total-row strong {
      font-family: "Playfair Display", serif;
      font-size: 23px;
      font-weight: 600;
      color: var(--plum);
    }

    .clear-button {
      width: 100%;
      margin-top: 17px;
      border: 1px solid #d9d0c3;
      background: transparent;
      color: var(--plum);
      padding: 11px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all .2s;
    }

    .clear-button:hover {
      background: #f4edf1;
      border-color: var(--plum);
    }

    .cart-note {
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      margin-top: 16px;
      font-style: italic;
    }

    .bottom-decoration {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 17px;
      margin: 60px 0 0;
      color: #bd8278;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 22px;
    }

    .bottom-decoration::before,
    .bottom-decoration::after {
      content: "";
      width: 85px;
      height: 1px;
      background: #d9b8b4;
    }

    .footer {
      background: #f0e5df;
      text-align: center;
      padding: 34px 15px;
      color: var(--muted);
    }

    .footer-brand {
      font-family: "Playfair Display", serif;
      font-size: 24px;
      color: var(--brown);
      margin-bottom: 6px;
    }

    .footer p {
      font-size: 10px;
      letter-spacing: 1px;
    }

    @media (max-width: 850px) {
      .content-grid {
        grid-template-columns: 1fr;
      }

      .cart-panel {
        position: static;
      }
    }

    @media (max-width: 520px) {
      .products-grid {
        grid-template-columns: 1fr;
      }

      .hero::before {
        left: -30px;
        font-size: 75px;
      }

      .hero::after {
        right: -30px;
        font-size: 75px;
      }

      .collection-heading {
        align-items: start;
        flex-direction: column;
        gap: 5px;
      }

      .collection-heading h2 {
        font-size: 37px;
      }

      .product-art {
        height: 180px;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const products = [
      {
        id: 1,
        name: "Coffee",
        price: 4500,
        emoji: "☕",
        category: "The Daily Ritual",
        description: "A little cup of happiness.",
        art: "coffee-art"
      },
      {
        id: 2,
        name: "Sandwich",
        price: 7000,
        emoji: "🥪",
        category: "Freshly Made",
        description: "A lovely lunch, made fresh.",
        art: "sandwich-art"
      },
      {
        id: 3,
        name: "Lemon Tea",
        price: 4000,
        emoji: "🍋",
        category: "Something Refreshing",
        description: "Bright, sweet and refreshing.",
        art: "lemon-art"
      },
      {
        id: 4,
        name: "Pizza",
        price: 12000,
        emoji: "🍕",
        category: "From Our Kitchen",
        description: "A warm slice to share.",
        art: "pizza-art"
      },
      {
        id: 5,
        name: "Chocolate Cake",
        price: 6500,
        emoji: "🍰",
        category: "A Sweet Treat",
        description: "Rich chocolate, little joy.",
        art: "cake-art"
      },
      {
        id: 6,
        name: "Vanilla Ice Cream",
        price: 5000,
        emoji: "🍨",
        category: "Something Sweet",
        description: "Classic, creamy and lovely.",
        art: "icecream-art"
      }
    ];

    function formatPrice(price) {
      return "₩" + price.toLocaleString("ko-KR");
    }

    function ProductCard({ product, onAdd }) {
      return (
        <article className="product-card">
          <div className={"product-art " + product.art}>
            <span className="product-emoji">{product.emoji}</span>
          </div>

          <div className="product-info">
            <div className="product-category">{product.category}</div>
            <h3>{product.name}</h3>
            <p className="product-description">{product.description}</p>

            <div className="product-bottom">
              <span className="product-price">
                {formatPrice(product.price)}
              </span>

              <button
                className="add-button"
                onClick={() => onAdd(product)}
              >
                + Add to bag
              </button>
            </div>
          </div>
        </article>
      );
    }

    function ProductList({ products, onAdd }) {
      return (
        <div className="products-grid">
          {products.map(product => (
            <ProductCard
              key={product.id}
              product={product}
              onAdd={onAdd}
            />
          ))}
        </div>
      );
    }

    function CartItem({ item, onIncrease, onDecrease, onRemove }) {
      return (
        <div className="cart-item">
          <div className="cart-item-top">
            <span className="cart-item-name">
              {item.emoji} {item.name}
            </span>
            <span className="cart-item-price">
              {formatPrice(item.price * item.quantity)}
            </span>
          </div>

          <div className="quantity-row">
            <div className="quantity-controls">
              <button
                onClick={() => onDecrease(item.id)}
                aria-label={"Decrease " + item.name}
              >−</button>

              <span className="quantity-number">{item.quantity}</span>

              <button
                onClick={() => onIncrease(item.id)}
                aria-label={"Increase " + item.name}
              >+</button>
            </div>

            <button
              className="remove-button"
              onClick={() => onRemove(item.id)}
            >
              Remove
            </button>
          </div>
        </div>
      );
    }

    function ShoppingCart({
      cart,
      onIncrease,
      onDecrease,
      onRemove,
      onClear
    }) {
      const totalQuantity = cart.reduce(
        (total, item) => total + item.quantity, 0
      );

      const totalPrice = cart.reduce(
        (total, item) => total + item.price * item.quantity, 0
      );

      return (
        <aside className="cart-panel">
          <div className="cart-top">
            <div className="cart-small-label">Your little selection</div>
            <h2>Shopping Bag</h2>
            <div className="cart-count">
              {totalQuantity} {totalQuantity === 1 ? "item" : "items"} selected
            </div>
          </div>

          {cart.length === 0 ? (
            <div className="empty-cart">
              <div className="empty-basket">🧺</div>
              <h3>A little empty here...</h3>
              <p>Choose something lovely from our collection.</p>
            </div>
          ) : (
            <>
              {cart.map(item => (
                <CartItem
                  key={item.id}
                  item={item}
                  onIncrease={onIncrease}
                  onDecrease={onDecrease}
                  onRemove={onRemove}
                />
              ))}

              <div className="summary">
                <div className="summary-row">
                  <span>Number of items</span>
                  <span>{totalQuantity}</span>
                </div>

                <div className="summary-row">
                  <span>Delivery</span>
                  <span>Free</span>
                </div>

                <div className="summary-row total-row">
                  <span>Total</span>
                  <strong>{formatPrice(totalPrice)}</strong>
                </div>

                <button className="clear-button" onClick={onClear}>
                  Clear shopping bag
                </button>

                <p className="cart-note">
                  A little treat makes every day better.
                </p>
              </div>
            </>
          )}
        </aside>
      );
    }

    function App() {
      const [cart, setCart] = useState([]);

      function addToCart(product) {
        setCart(prevCart => {
          const existing = prevCart.find(
            item => item.id === product.id
          );

          if (existing) {
            return prevCart.map(item =>
              item.id === product.id
                ? { ...item, quantity: item.quantity + 1 }
                : item
            );
          }

          return [...prevCart, { ...product, quantity: 1 }];
        });
      }

      function increaseQuantity(id) {
        setCart(prevCart =>
          prevCart.map(item =>
            item.id === id
              ? { ...item, quantity: item.quantity + 1 }
              : item
          )
        );
      }

      function decreaseQuantity(id) {
        setCart(prevCart =>
          prevCart
            .map(item =>
              item.id === id
                ? { ...item, quantity: Math.max(0, item.quantity - 1) }
                : item
            )
            .filter(item => item.quantity > 0)
        );
      }

      function removeItem(id) {
        setCart(prevCart =>
          prevCart.filter(item => item.id !== id)
        );
      }

      function clearCart() {
        setCart([]);
      }

      const totalQuantity = cart.reduce(
        (total, item) => total + item.quantity, 0
      );

      return (
        <>
          <div className="announcement">
            A little joy, delivered with love · Welcome to our shop
          </div>

          <header className="topbar">
            <div>
              <div className="logo">the little <em>market.</em></div>
              <div className="logo-caption">A collection of good things</div>
            </div>

            <div className="cart-label">
              <span className="cart-label-icon">♧</span>
              My bag · {totalQuantity}
            </div>
          </header>

          <section className="hero">
            <div className="hero-kicker">A LITTLE SOMETHING FOR YOU</div>
            <h1>Good things,<br /><em>gathered with love.</em></h1>
            <p className="hero-description">
              From your morning coffee to an afternoon sweet treat,
              find the little things that make your day.
            </p>
            <div className="hero-decoration">made for lovely moments</div>
          </section>

          <main className="main-container">
            <div className="collection-heading">
              <div>
                <h2>Our little collection</h2>
                <p>Thoughtfully picked, simply enjoyed.</p>
              </div>
              <p className="collection-number">No. 01 — 06</p>
            </div>

            <div className="content-grid">
              <ProductList
                products={products}
                onAdd={addToCart}
              />

              <ShoppingCart
                cart={cart}
                onIncrease={increaseQuantity}
                onDecrease={decreaseQuantity}
                onRemove={removeItem}
                onClear={clearCart}
              />
            </div>

            <div className="bottom-decoration">
              Thank you for stopping by
            </div>
          </main>

          <footer className="footer">
            <div className="footer-brand">the little market.</div>
            <p>A SMALL SHOP WITH A LOT OF LOVE</p>
            <p style={{marginTop: "12px"}}>
              REACT SHOPPING CART · WEEK 12_1
            </p>
          </footer>
        </>
      );
    }

    const root = ReactDOM.createRoot(
      document.getElementById("root")
    );

    root.render(<App />);
  </script>
</body>
</html>
