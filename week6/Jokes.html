
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Fetcher</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f0ff;
            color: #30264a;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        header h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        header p {
            color: #766b8c;
        }

        .container {
            max-width: 700px;
            margin: 20px auto;
            padding: 20px;
        }

        .joke-card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(60, 40, 100, 0.1);
        }

        .label {
            color: #7657c8;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #setup {
            font-size: 23px;
            line-height: 1.5;
            margin: 12px 0 25px;
        }

        #punchline {
            font-size: 19px;
            line-height: 1.5;
            background: #f4f0ff;
            padding: 16px;
            border-radius: 10px;
            min-height: 55px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 25px 0;
        }

        button {
            border: none;
            border-radius: 9px;
            padding: 13px 18px;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #loadButton {
            background: #7657c8;
            color: white;
        }

        #favoriteButton {
            background: #ffe5ed;
            color: #9b3157;
        }

        #status {
            text-align: center;
            color: #7657c8;
            min-height: 24px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 4px solid #e4dcf8;
            border-top: 4px solid #7657c8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 15px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none;
        }

        .favorites {
            margin-top: 35px;
        }

        .favorites h2 {
            font-size: 21px;
        }

        .favorite-item {
            background: white;
            padding: 16px;
            margin: 12px 0;
            border-radius: 10px;
            line-height: 1.5;
        }

        .remove-button {
            background: #eee8ff;
            color: #59418c;
            margin-top: 10px;
            padding: 8px 12px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #766b8c;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <header>
        <h1>😂 Random Joke Fetcher</h1>
        <p>A little laughter can make your day better!</p>
    </header>

    <main class="container">

        <section class="joke-card">

            <p class="label">The setup</p>
            <p id="setup">Click the button to discover a joke!</p>

            <p class="label">The punchline</p>
            <p id="punchline">Your punchline will appear here.</p>

            <div id="spinner" class="spinner hidden"></div>
            <p id="status" aria-live="polite"></p>

            <div class="buttons">
                <button id="loadButton" onclick="loadJoke()">
                    Get a Random Joke
                </button>

                <button id="favoriteButton" onclick="saveFavorite()" disabled>
                    ♡ Save Favourite
                </button>
            </div>

        </section>

        <section class="favorites">
            <h2>❤️ My Favourite Jokes</h2>
            <div id="favoritesList"></div>
        </section>

    </main>

    <footer>
        Made with HTML, CSS and JavaScript
    </footer>

    <script>
        const setupElement = document.getElementById("setup");
        const punchlineElement = document.getElementById("punchline");
        const statusElement = document.getElementById("status");
        const spinner = document.getElementById("spinner");
        const loadButton = document.getElementById("loadButton");
        const favoriteButton = document.getElementById("favoriteButton");
        const favoritesList = document.getElementById("favoritesList");

        let currentJoke = null;

        async function loadJoke() {
            loadButton.disabled = true;
            favoriteButton.disabled = true;

            setupElement.textContent = "";
            punchlineElement.textContent = "";
            statusElement.textContent = "Loading...";
            spinner.classList.remove("hidden");
            currentJoke = null;

            try {
                const response = await fetch(
                    "https://v2.jokeapi.dev/joke/Any?type=twopart&blacklistFlags=nsfw,religious,political,racist,sexist,explicit"
                );

                if (!response.ok) {
                    throw new Error("Unable to fetch a joke.");
                }

                const data = await response.json();

                if (data.error || !data.setup || !data.delivery) {
                    throw new Error("Invalid joke received.");
                }

                currentJoke = {
                    setup: data.setup,
                    punchline: data.delivery
                };

                setupElement.textContent = currentJoke.setup;
                punchlineElement.textContent = currentJoke.punchline;

                statusElement.textContent = "Here's your joke! 🎉";
                favoriteButton.disabled = false;

            } catch (error) {
                setupElement.textContent = "Oops! Something went wrong.";
                punchlineElement.textContent =
                    "Please check your internet connection and try again.";
                statusElement.textContent = "We couldn't load a joke.";
            } finally {
                spinner.classList.add("hidden");
                loadButton.disabled = false;
            }
        }

        function getFavorites() {
            try {
                return JSON.parse(
                    localStorage.getItem("favoriteJokes")
                ) || [];
            } catch (error) {
                return [];
            }
        }

        function saveFavorite() {
            if (!currentJoke) {
                return;
            }

            const favorites = getFavorites();

            const alreadySaved = favorites.some(joke =>
                joke.setup === currentJoke.setup &&
                joke.punchline === currentJoke.punchline
            );

            if (alreadySaved) {
                statusElement.textContent = "This joke is already saved!";
                return;
            }

            favorites.push(currentJoke);

            localStorage.setItem(
                "favoriteJokes",
                JSON.stringify(favorites)
            );

            statusElement.textContent = "Favourite saved! ❤️";
            displayFavorites();
        }

        function displayFavorites() {
            const favorites = getFavorites();
            favoritesList.innerHTML = "";

            if (favorites.length === 0) {
                favoritesList.textContent = "No favourite jokes saved yet.";
                return;
            }

            favorites.forEach((joke, index) => {
                const item = document.createElement("div");
                item.className = "favorite-item";

                const setup = document.createElement("p");
                setup.textContent = joke.setup;

                const punchline = document.createElement("p");
                punchline.textContent = joke.punchline;

                const removeButton = document.createElement("button");
                removeButton.textContent = "Remove";
                removeButton.className = "remove-button";

                removeButton.addEventListener("click", () => {
                    const updatedFavorites = getFavorites();
                    updatedFavorites.splice(index, 1);

                    localStorage.setItem(
                        "favoriteJokes",
                        JSON.stringify(updatedFavorites)
                    );

                    displayFavorites();
                });

                item.appendChild(setup);
                item.appendChild(punchline);
                item.appendChild(removeButton);

                favoritesList.appendChild(item);
            });
        }

        displayFavorites();
    </script>

</body>
</html>
