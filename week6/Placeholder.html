
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Posts Explorer</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 35px 20px;
            font-family: Arial, sans-serif;
            background: #f1f3fb;
            color: #20243a;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        header {
            background: linear-gradient(135deg, #252b64, #6554c0);
            color: white;
            padding: 35px;
            border-radius: 18px;
            margin-bottom: 25px;
        }

        .tag {
            font-size: 12px;
            letter-spacing: 2px;
            color: #c7c8ff;
            font-weight: bold;
        }

        h1 { margin: 12px 0; font-size: 32px; }

        header p {
            color: #e0e2ff;
            line-height: 1.6;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        #loadBtn {
            background: #6254c5;
            color: white;
        }

        #loadBtn:hover { background: #493ba8; }

        #clearBtn {
            background: white;
            color: #555;
            border: 1px solid #ddd;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #status {
            color: #6254c5;
            font-size: 14px;
            margin: 15px 0;
        }

        .posts {
            display: grid;
            gap: 15px;
        }

        .post-card {
            background: white;
            border-radius: 13px;
            padding: 22px;
            border: 1px solid #e6e7f0;
            box-shadow: 0 3px 12px rgba(35, 35, 80, 0.05);
        }

        .post-number {
            display: inline-block;
            background: #eeebff;
            color: #6254c5;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .post-card h2 {
            font-size: 18px;
            line-height: 1.5;
            color: #292d52;
            margin: 0 0 10px;
        }

        .post-card p {
            color: #697087;
            font-size: 14px;
            line-height: 1.8;
            margin: 0;
        }

        .empty {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 13px;
            color: #777;
        }

        .error { color: #d32f2f; }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            header { padding: 25px; }
            h1 { font-size: 26px; }
        }
    </style>
</head>

<body>
<div class="container">

    <header>
        <div class="tag">WEEK 06 · FETCH API</div>
        <h1>📚 English Posts Explorer</h1>
        <p>
            Explore easy-to-read English sample posts.
            Fetch and display them dynamically from a public API.
        </p>
    </header>

    <div class="controls">
        <button id="loadBtn" onclick="loadPosts()">
            ↓ Load 10 Posts
        </button>

        <button id="clearBtn" onclick="clearPosts()">
            Clear Posts
        </button>
    </div>

    <div id="status">Ready to load posts.</div>

    <div class="posts" id="posts">
        <div class="empty">
            No posts loaded yet. Click "Load 10 Posts" to begin!
        </div>
    </div>

    <footer>Sample data provided by DummyJSON</footer>
</div>

<script>
    async function loadPosts() {
        const postsContainer = document.getElementById("posts");
        const status = document.getElementById("status");
        const loadBtn = document.getElementById("loadBtn");

        loadBtn.disabled = true;
        loadBtn.textContent = "Loading...";
        status.textContent = "Fetching English posts...";

        postsContainer.innerHTML = `
            <div class="empty">⏳ Loading posts...</div>
        `;

        try {
            const response = await fetch(
                "https://dummyjson.com/posts?limit=10"
            );

            if (!response.ok) {
                throw new Error("Could not load posts.");
            }

            const data = await response.json();

            postsContainer.innerHTML = "";

            data.posts.forEach((post, index) => {
                const card = document.createElement("div");
                card.className = "post-card";

                const number = document.createElement("div");
                number.className = "post-number";
                number.textContent = "POST #" + (index + 1);

                const title = document.createElement("h2");
                title.textContent = (index + 1) + ". " + post.title;

                const body = document.createElement("p");
                body.textContent = post.body;

                card.appendChild(number);
                card.appendChild(title);
                card.appendChild(body);

                postsContainer.appendChild(card);
            });

            status.textContent =
                "✓ Successfully loaded " + data.posts.length + " posts.";

        } catch (error) {
            console.error(error);

            postsContainer.innerHTML = `
                <div class="empty error">
                    Unable to load posts. Please try again.
                </div>
            `;

            status.textContent = "Something went wrong.";

        } finally {
            loadBtn.disabled = false;
            loadBtn.textContent = "↓ Load 10 Posts";
        }
    }

    function clearPosts() {
        document.getElementById("posts").innerHTML = `
            <div class="empty">
                Posts cleared. Load them again whenever you like!
            </div>
        `;

        document.getElementById("status").textContent =
            "All posts have been cleared.";
    }
</script>

</body>
</html>
