<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Around the World</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 35px 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #172554, #2563a6, #60a5fa);
            min-height: 100vh;
            color: white;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        header p {
            color: #dbeafe;
            font-size: 16px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        #status {
            color: #dbeafe;
            font-size: 14px;
        }

        button {
            background: white;
            color: #1d4ed8;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #dbeafe;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.95);
            color: #1e293b;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .city {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .country {
            color: #64748b;
            font-size: 13px;
        }

        .weather-icon {
            font-size: 42px;
            margin: 18px 0 5px;
        }

        .temperature {
            font-size: 42px;
            font-weight: bold;
            color: #2563eb;
        }

        .description {
            color: #64748b;
            margin: 5px 0 20px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .detail {
            background: #eff6ff;
            border-radius: 10px;
            padding: 12px;
        }

        .detail span {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .detail strong {
            font-size: 17px;
            color: #1e40af;
        }

        .error {
            color: #b91c1c;
            font-size: 13px;
            margin-top: 15px;
        }

        footer {
            text-align: center;
            color: #dbeafe;
            font-size: 13px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 28px;
            }

            .top-bar {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>🌍 Weather Around the World</h1>
        <p>Explore live weather conditions in different cities.</p>
    </header>

    <div class="top-bar">
        <span id="status">Loading weather information...</span>
        <button id="refreshBtn" onclick="loadWeather()">
            ↻ Refresh Weather
        </button>
    </div>

    <div class="weather-grid" id="weatherGrid"></div>

    <footer>
        Weather data provided by Open-Meteo
    </footer>

</div>

<script>
    const cities = [
        {
            name: "Seongnam",
            country: "South Korea",
            latitude: 37.420,
            longitude: 127.126
        },
        {
            name: "Seoul",
            country: "South Korea",
            latitude: 37.5665,
            longitude: 126.9780
        },
        {
            name: "Tokyo",
            country: "Japan",
            latitude: 35.6762,
            longitude: 139.6503
        },
        {
            name: "Kathmandu",
            country: "Nepal",
            latitude: 27.7172,
            longitude: 85.3240
        },
        {
            name: "London",
            country: "United Kingdom",
            latitude: 51.5072,
            longitude: -0.1276
        },
        {
            name: "New York",
            country: "United States",
            latitude: 40.7128,
            longitude: -74.0060
        }
    ];

    function getWeatherDescription(code) {
        const weatherTypes = {
            0: ["☀️", "Clear sky"],
            1: ["🌤️", "Mainly clear"],
            2: ["⛅", "Partly cloudy"],
            3: ["☁️", "Overcast"],
            45: ["🌫️", "Foggy"],
            48: ["🌫️", "Rime fog"],
            51: ["🌦️", "Light drizzle"],
            53: ["🌦️", "Moderate drizzle"],
            55: ["🌧️", "Heavy drizzle"],
            61: ["🌧️", "Light rain"],
            63: ["🌧️", "Moderate rain"],
            65: ["🌧️", "Heavy rain"],
            71: ["❄️", "Light snow"],
            73: ["❄️", "Moderate snow"],
            75: ["❄️", "Heavy snow"],
            80: ["🌦️", "Rain showers"],
            81: ["🌧️", "Moderate showers"],
            82: ["⛈️", "Heavy showers"],
            95: ["⛈️", "Thunderstorm"],
            96: ["⛈️", "Thunderstorm with hail"],
            99: ["⛈️", "Heavy thunderstorm"]
        };

        return weatherTypes[code] || ["🌡️", "Unknown conditions"];
    }

    async function getCityWeather(city) {
        const url =
            `https://api.open-meteo.com/v1/forecast?latitude=${city.latitude}&longitude=${city.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,wind_speed_10m,weather_code&timezone=auto`;

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Weather service unavailable");
        }

        const data = await response.json();

        if (!data.current) {
            throw new Error("Weather data is missing");
        }

        return data;
    }

    function createWeatherCard(city, data) {
        const current = data.current;
        const weather = getWeatherDescription(current.weather_code);

        return `
            <div class="weather-card">
                <div class="city">${city.name}</div>
                <div class="country">${city.country}</div>

                <div class="weather-icon">${weather[0]}</div>

                <div class="temperature">
                    ${current.temperature_2m}°C
                </div>

                <div class="description">${weather[1]}</div>

                <div class="details">
                    <div class="detail">
                        <span>Feels Like</span>
                        <strong>${current.apparent_temperature}°C</strong>
                    </div>

                    <div class="detail">
                        <span>Humidity</span>
                        <strong>${current.relative_humidity_2m}%</strong>
                    </div>

                    <div class="detail">
                        <span>Wind Speed</span>
                        <strong>${current.wind_speed_10m} km/h</strong>
                    </div>

                    <div class="detail">
                        <span>Precipitation</span>
                        <strong>${current.precipitation} mm</strong>
                    </div>
                </div>
            </div>
        `;
    }

    async function loadWeather() {
        const grid = document.getElementById("weatherGrid");
        const status = document.getElementById("status");
        const button = document.getElementById("refreshBtn");

        button.disabled = true;
        button.textContent = "Loading...";
        status.textContent = "Getting weather for all cities...";

        grid.innerHTML = "";

        const results = await Promise.allSettled(
            cities.map(city => getCityWeather(city))
        );

        let successCount = 0;

        results.forEach((result, index) => {
            const city = cities[index];

            if (result.status === "fulfilled") {
                grid.innerHTML += createWeatherCard(
                    city,
                    result.value
                );
                successCount++;
            } else {
                grid.innerHTML += `
                    <div class="weather-card">
                        <div class="city">${city.name}</div>
                        <div class="country">${city.country}</div>
                        <p class="error">
                            Unable to load weather for this city.
                            Please try again.
                        </p>
                    </div>
                `;
                console.error(city.name, result.reason);
            }
        });

        status.textContent =
            `${successCount} of ${cities.length} cities loaded successfully.`;

        button.disabled = false;
        button.textContent = "↻ Refresh Weather";
    }

    loadWeather();
</script>

</body>
</html>
