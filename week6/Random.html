
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Generator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eee7ff, #fce8f3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(80, 50, 120, 0.12);
        }

        h1 {
            color: #60458a;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .profile {
            background: #faf7ff;
            border-radius: 18px;
            padding: 25px 15px;
            margin-bottom: 25px;
        }

        .profile img {
            width: 135px;
            height: 135px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 4px 15px rgba(80, 50, 120, 0.15);
            margin-bottom: 18px;
        }

        .profile h2 {
            color: #493467;
            font-size: 22px;
            margin-bottom: 9px;
        }

        .profile p {
            color: #888;
            font-size: 14px;
            word-break: break-word;
        }

        button {
            background: #8462b5;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #684797;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        #message {
            color: #999;
            font-size: 12px;
            margin-top: 18px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Random User Generator</h1>
        <p class="subtitle">Discover a new person with every click!</p>

        <div class="profile">
            <img id="userPhoto"
                 src="https://randomuser.me/api/portraits/women/44.jpg"
                 alt="User profile photo">

            <h2 id="userName">Emma Wilson</h2>
            <p id="userEmail">emma.wilson@example.com</p>
        </div>

        <button id="generateBtn" onclick="getRandomUser()">
            Get Another User
        </button>

        <p id="message">Click the button to discover someone new.</p>
    </div>

    <script>
        async function getRandomUser() {
            const button = document.getElementById("generateBtn");
            const message = document.getElementById("message");

            button.disabled = true;
            button.textContent = "Loading...";
            message.textContent = "Finding a new user...";

            try {
                const response = await fetch("https://randomuser.me/api/");

                if (!response.ok) {
                    throw new Error("Could not fetch user data.");
                }

                const data = await response.json();
                const user = data.results[0];

                const fullName =
                    user.name.first + " " + user.name.last;

                document.getElementById("userPhoto").src =
                    user.picture.large;

                document.getElementById("userName").textContent =
                    fullName;

                document.getElementById("userEmail").textContent =
                    user.email;

                message.textContent = "Here's your new random user!";

            } catch (error) {
                message.textContent =
                    "Something went wrong. Please try again.";
            }

            button.disabled = false;
            button.textContent = "Get Another User";
        }
    </script>

</body>
</html>
