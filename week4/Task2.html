<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dark Mode Toggle Card</title>

  <style>
    body {
      font-family: system-ui;
      background: #f3f4f6;
      padding: 40px;
      text-align: center;
    }

    .card {
      width: 300px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      color: #222;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      transition: 0.3s;
    }

    .card.dark {
      background: #1a2340;
      color: white;
    }

    .avatar {
      font-size: 50px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div id="card" class="card">

    <div class="avatar">👩‍💻</div>

    <h2>Kim Jisoo</h2>

    <p>Web Programming Student</p>

    <button id="toggle-btn">Dark Mode</button>

  </div>


  <script>
    const card = document.querySelector("#card");
    const toggleBtn = document.querySelector("#toggle-btn");

    toggleBtn.addEventListener("click", function () {

      card.classList.toggle("dark");

      if (card.classList.contains("dark")) {
        toggleBtn.textContent = "Light Mode";
      } else {
        toggleBtn.textContent = "Dark Mode";
      }

    });
  </script>

</body>
</html>
