<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Dashboard | Week 12</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
:root {
  --ink: #292438;
  --muted: #777187;
  --purple: #7863ad;
  --deep: #514174;
  --lavender: #eee9f8;
  --blue: #e3f0fb;
  --mint: #e0f1e9;
  --yellow: #fff1c9;
  --coral: #ffe5df;
  --white: #fff;
  --line: #e8e1f1;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 30px 16px 50px;
  min-height: 100vh;
  font-family: "DM Sans", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 5% 8%, #e5dcf7 0, transparent 28%),
    radial-gradient(circle at 95% 25%, #dceefa 0, transparent 25%),
    radial-gradient(circle at 75% 95%, #e1f1e7 0, transparent 25%),
    #faf8fd;
}

button, input { font: inherit; }

.page {
  max-width: 1050px;
  margin: auto;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 35px;
}

.brand {
  color: var(--deep);
  font-weight: 800;
  font-size: 16px;
}

.week-tag {
  background: white;
  border: 1px solid var(--line);
  border-radius: 30px;
  padding: 9px 15px;
  color: var(--purple);
  font-size: 11px;
  font-weight: 800;
}

.hero {
  text-align: center;
  margin-bottom: 28px;
}

.eyebrow {
  display: inline-block;
  padding: 8px 14px;
  border-radius: 30px;
  background: var(--yellow);
  color: #80652a;
  font-size: 10px;
  letter-spacing: 1.7px;
  font-weight: 800;
}

h1 {
  font-family: "Playfair Display", serif;
  color: var(--deep);
  font-size: clamp(38px, 7vw, 61px);
  margin: 13px 0 8px;
}

.hero p {
  color: var(--muted);
  font-size: 14px;
  margin: 0;
}

.hero-decoration {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 17px;
  font-size: 21px;
}

.dashboard {
  background: rgba(255,255,255,.94);
  border: 1px solid var(--line);
  border-radius: 25px;
  padding: 25px;
  box-shadow: 0 18px 55px rgba(73,56,112,.09);
}

.search-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--deep);
  margin: 0 0 6px;
}

.search-subtitle {
  color: var(--muted);
  font-size: 12px;
  margin: 0 0 17px;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.tab {
  border: 1px solid var(--line);
  background: #faf9fd;
  color: var(--muted);
  border-radius: 30px;
  padding: 10px 16px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
}

.tab.active {
  background: var(--deep);
  color: white;
  border-color: var(--deep);
}

.search-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.search-row input {
  flex: 1;
  min-width: 150px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  background: #fcfbfe;
  outline: none;
  color: var(--ink);
}

.search-row input:focus {
  border-color: var(--purple);
  box-shadow: 0 0 0 3px var(--lavender);
}

.primary-btn, .location-btn {
  border: 0;
  border-radius: 12px;
  padding: 13px 18px;
  cursor: pointer;
  font-weight: 800;
  font-size: 12px;
  transition: .2s;
}

.primary-btn {
  background: var(--deep);
  color: white;
}

.primary-btn:hover { background: var(--purple); }

.location-btn {
  margin-top: 11px;
  background: var(--blue);
  color: #42617c;
}

.location-btn:hover { background: #d4e8f8; }

.hint {
  color: var(--muted);
  font-size: 11px;
  margin: 10px 0 0;
}

.message {
  margin-top: 18px;
  border-radius: 13px;
  padding: 14px;
  font-size: 12px;
  line-height: 1.6;
}

.loading {
  color: var(--deep);
  background: var(--lavender);
}

.error {
  color: #983e4a;
  background: #fff0ef;
  border: 1px solid #f4d4d1;
}

.weather-result { margin-top: 25px; }

.weather-main {
  border-radius: 22px;
  padding: 28px;
  color: white;
  background: linear-gradient(120deg, #57447f, #8171b5 55%, #9bb8d8);
  position: relative;
  overflow: hidden;
  min-height: 235px;
}

.weather-main::after {
  content: "☁";
  position: absolute;
  right: 35px;
  top: -45px;
  font-size: 190px;
  opacity: .12;
}

.weather-main::before {
  content: "✦";
  position: absolute;
  right: 190px;
  bottom: 20px;
  font-size: 28px;
  opacity: .45;
}

.place {
  font-size: 12px;
  opacity: .85;
  font-weight: 700;
  letter-spacing: 1px;
}

.weather-main h2 {
  font-family: "Playfair Display", serif;
  font-size: 27px;
  margin: 10px 0 0;
}

.temperature-row {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 15px;
  position: relative;
  z-index: 1;
}

.weather-icon { font-size: 68px; }

.temperature {
  font-size: 61px;
  font-weight: 800;
  letter-spacing: -3px;
  line-height: 1;
}

.description {
  font-size: 13px;
  margin-top: 9px;
  opacity: .9;
}

.weather-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 14px;
}

.weather-card {
  padding: 19px;
  border-radius: 17px;
  border: 1px solid transparent;
}

.weather-card:nth-child(1) {
  background: var(--yellow);
  border-color: #f5e6bd;
}

.weather-card:nth-child(2) {
  background: var(--blue);
  border-color: #d6e8f6;
}

.weather-card:nth-child(3) {
  background: var(--mint);
  border-color: #d6eadd;
}

.weather-card .icon {
  font-size: 24px;
  margin-bottom: 12px;
}

.weather-card .label {
  font-size: 10px;
  color: var(--muted);
  font-weight: 800;
  letter-spacing: .6px;
}

.weather-card .value {
  font-size: 23px;
  font-weight: 800;
  margin-top: 5px;
  color: var(--deep);
}

.forecast-section {
  margin-top: 27px;
}

.forecast-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 13px;
}

.forecast-heading h3 {
  margin: 0;
  color: var(--deep);
  font-size: 16px;
}

.forecast-heading span {
  font-size: 11px;
  color: var(--muted);
}

.forecast-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

.forecast-card {
  text-align: center;
  padding: 16px 8px;
  background: #f8f6fc;
  border: 1px solid var(--line);
  border-radius: 15px;
}

.forecast-card:nth-child(2) { background: #fff8e7; }
.forecast-card:nth-child(3) { background: #eef6fb; }
.forecast-card:nth-child(4) { background: #edf6f0; }
.forecast-card:nth-child(5) { background: #fff0ec; }

.forecast-day {
  font-size: 11px;
  font-weight: 800;
  color: var(--deep);
}

.forecast-icon {
  font-size: 27px;
  margin: 11px 0;
}

.forecast-temp {
  font-size: 12px;
  font-weight: 800;
}

.forecast-temp span {
  color: var(--muted);
  font-weight: 500;
}

.updated {
  text-align: right;
  font-size: 10px;
  color: var(--muted);
  margin-top: 13px;
}

.footer {
  text-align: center;
  margin-top: 24px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.8;
}

.footer strong { color: var(--purple); }

@media(max-width:650px) {
  body { padding: 20px 12px 35px; }
  .dashboard { padding: 17px; }
  .weather-grid { grid-template-columns: 1fr; }
  .weather-card {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .weather-card .icon { margin: 0; }
  .forecast-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
  .forecast-card { padding: 12px 3px; }
  .forecast-icon { font-size: 21px; }
  .forecast-day, .forecast-temp { font-size: 9px; }
  .temperature { font-size: 49px; }
  .weather-main { padding: 22px; }
  .search-row button { width: 100%; }
  .topbar { margin-bottom: 25px; }
}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function getWeatherInfo(code) {
  const types = {
    0: ["Clear sky", "☀️"],
    1: ["Mainly clear", "🌤️"],
    2: ["Partly cloudy", "⛅"],
    3: ["Overcast", "☁️"],
    45: ["Foggy", "🌫️"],
    48: ["Foggy", "🌫️"],
    51: ["Light drizzle", "🌦️"],
    53: ["Drizzle", "🌦️"],
    55: ["Heavy drizzle", "🌧️"],
    61: ["Light rain", "🌧️"],
    63: ["Moderate rain", "🌧️"],
    65: ["Heavy rain", "🌧️"],
    71: ["Light snow", "🌨️"],
    73: ["Snow", "❄️"],
    75: ["Heavy snow", "❄️"],
    80: ["Rain showers", "🌦️"],
    81: ["Rain showers", "🌧️"],
    82: ["Heavy showers", "⛈️"],
    95: ["Thunderstorm", "⛈️"],
    96: ["Thunderstorm with hail", "⛈️"],
    99: ["Heavy thunderstorm", "⛈️"]
  };

  return types[code] || ["Unknown weather", "🌡️"];
}

function WeatherDashboard() {
  const [searchMode, setSearchMode] = useState("city");
  const [cityInput, setCityInput] = useState("Seoul");
  const [latitude, setLatitude] = useState("37.5665");
  const [longitude, setLongitude] = useState("126.9780");

  const [location, setLocation] = useState({
    type: "city",
    value: "Seoul"
  });

  const [weather, setWeather] = useState(null);
  const [forecast, setForecast] = useState(null);
  const [placeName, setPlaceName] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  // Fetch weather whenever the selected location changes.
  useEffect(() => {
    const controller = new AbortController();
    let stage = "city search";
    let timedOut = false;

    const timeoutId = setTimeout(() => {
      timedOut = true;
      controller.abort();
    }, 15000);

    async function fetchWeather() {
      setLoading(true);
      setError("");
      setWeather(null);
      setForecast(null);

      try {
        let lat;
        let lon;
        let displayName = "";

        // STEP 1: Convert city name into coordinates.
        if (location.type === "city") {
          const city = location.value.trim();

          if (!city) {
            throw new Error("Please enter a city name.");
          }

          stage = "city search";

          const geoParams = new URLSearchParams({
            name: city,
            count: "1",
            language: "en",
            format: "json"
          });

          const geoResponse = await fetch(
            `https://geocoding-api.open-meteo.com/v1/search?${geoParams}`,
            { signal: controller.signal }
          );

          if (!geoResponse.ok) {
            throw new Error(
              `City search service returned error ${geoResponse.status}.`
            );
          }

          const geoData = await geoResponse.json();

          if (!geoData.results || geoData.results.length === 0) {
            throw new Error(
              `No city named "${city}" was found. Check the spelling or try another city.`
            );
          }

          const result = geoData.results[0];

          lat = result.latitude;
          lon = result.longitude;
          displayName = result.name;

          if (result.country) {
            displayName += ", " + result.country;
          }
        } else {
          // STEP 1 alternative: Use coordinates directly.
          lat = Number(location.value.latitude);
          lon = Number(location.value.longitude);

          if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lon) ||
            lat < -90 || lat > 90 ||
            lon < -180 || lon > 180
          ) {
            throw new Error(
              "Invalid coordinates. Latitude must be between -90 and 90, and longitude between -180 and 180."
            );
          }

          displayName = "Custom coordinates";
        }

        // STEP 2: Request current weather and five-day forecast.
        stage = "weather forecast";

        const weatherParams = new URLSearchParams({
          latitude: String(lat),
          longitude: String(lon),
          current: "temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m",
          daily: "weather_code,temperature_2m_max,temperature_2m_min",
          forecast_days: "5",
          timezone: "auto"
        });

        const response = await fetch(
          `https://api.open-meteo.com/v1/forecast?${weatherParams}`,
          { signal: controller.signal }
        );

        if (!response.ok) {
          throw new Error(
            `Weather service returned error ${response.status}.`
          );
        }

        const data = await response.json();

        if (!data.current) {
          throw new Error("The weather service returned no current weather data.");
        }

        setWeather(data.current);
        setForecast(data.daily);
        setPlaceName(displayName);

      } catch (err) {
        if (err.name === "AbortError") {
          if (timedOut) {
            setError(
              "The request took too long. Please try again or use coordinate search."
            );
            setLoading(false);
          }
          return;
        }

        if (err instanceof TypeError) {
          setError(
            `Unable to connect to the ${stage} service. Please check your connection, try again, or test the API link directly in your browser.`
          );
        } else {
          setError(err.message);
        }
      } finally {
        clearTimeout(timeoutId);

        if (!controller.signal.aborted) {
          setLoading(false);
        }
      }
    }

    fetchWeather();

    // Cleanup cancels the previous request.
    return () => {
      clearTimeout(timeoutId);
      controller.abort();
    };
  }, [location]);

  function searchCity(event) {
    event.preventDefault();

    setLocation({
      type: "city",
      value: cityInput.trim()
    });
  }

  function searchCoordinates(event) {
    event.preventDefault();

    setLocation({
      type: "coordinates",
      value: { latitude, longitude }
    });
  }

  function useMyLocation() {
    if (!navigator.geolocation) {
      setError("Your browser does not support location services.");
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (position) => {
        setError("");
        setLocation({
          type: "coordinates",
          value: {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude
          }
        });
      },
      () => {
        setError(
          "Location permission was denied. You can search using a city name instead."
        );
      },
      { timeout: 10000 }
    );
  }

  const weatherInfo = weather
    ? getWeatherInfo(weather.weather_code)
    : null;

  function getDayName(dateString, index) {
    if (index === 0) return "Today";

    return new Date(dateString + "T12:00:00").toLocaleDateString(
      "en-US",
      { weekday: "short" }
    );
  }

  return (
    <main className="page">

      <header className="topbar">
        <div className="brand">✦ Weather Explorer</div>
        <div className="week-tag">WEEK 12 · FRIDAY</div>
      </header>

      <section className="hero">
        <div className="eyebrow">☀ REACT · USEEFFECT · API</div>
        <h1>Weather Dashboard</h1>
        <p>Discover the weather around the world, one city at a time.</p>

        <div className="hero-decoration">
          <span>☀️</span>
          <span>☁️</span>
          <span>🌈</span>
          <span>🌧️</span>
          <span>❄️</span>
        </div>
      </section>

      <section className="dashboard">

        <h3 className="search-title">Where would you like to go?</h3>
        <p className="search-subtitle">
          Search for a city or enter its geographical coordinates.
        </p>

        <div className="tabs">
          <button
            className={`tab ${searchMode === "city" ? "active" : ""}`}
            onClick={() => setSearchMode("city")}
          >
            🏙️ City search
          </button>

          <button
            className={`tab ${searchMode === "coordinates" ? "active" : ""}`}
            onClick={() => setSearchMode("coordinates")}
          >
            📍 Coordinates
          </button>
        </div>

        {searchMode === "city" ? (
          <form className="search-row" onSubmit={searchCity}>
            <input
              value={cityInput}
              onChange={(e) => setCityInput(e.target.value)}
              placeholder="Enter a city, e.g. Seoul"
              aria-label="City name"
            />
            <button className="primary-btn" type="submit">
              Search weather →
            </button>
          </form>
        ) : (
          <form className="search-row" onSubmit={searchCoordinates}>
            <input
              value={latitude}
              onChange={(e) => setLatitude(e.target.value)}
              placeholder="Latitude"
              aria-label="Latitude"
            />
            <input
              value={longitude}
              onChange={(e) => setLongitude(e.target.value)}
              placeholder="Longitude"
              aria-label="Longitude"
            />
            <button className="primary-btn" type="submit">
              Search →
            </button>
          </form>
        )}

        <p className="hint">
          {searchMode === "city"
            ? "Suggestions: Seoul · Kathmandu · Tokyo · London · New York"
            : "Latitude: -90 to 90 · Longitude: -180 to 180"}
        </p>

        <button className="location-btn" onClick={useMyLocation}>
          📍 Use my current location
        </button>

        {loading && (
          <div className="message loading" role="status">
            ☁️ Gathering weather information... Please wait.
          </div>
        )}

        {error && (
          <div className="message error" role="alert">
            ⚠️ {error}
          </div>
        )}

        {weather && !loading && weatherInfo && (
          <section className="weather-result" aria-live="polite">

            <div className="weather-main">
              <div className="place">
                CURRENT WEATHER · {placeName.toUpperCase()}
              </div>

              <h2>{weatherInfo[0]}</h2>

              <div className="temperature-row">
                <div className="weather-icon">{weatherInfo[1]}</div>

                <div>
                  <div className="temperature">
                    {Math.round(weather.temperature_2m)}°
                  </div>
                  <div className="description">
                    Feels like {Math.round(weather.apparent_temperature)}°C
                  </div>
                </div>
              </div>
            </div>

            <div className="weather-grid">

              <div className="weather-card">
                <div className="icon">💨</div>
                <div>
                  <div className="label">WIND SPEED</div>
                  <div className="value">
                    {weather.wind_speed_10m} <small>km/h</small>
                  </div>
                </div>
              </div>

              <div className="weather-card">
                <div className="icon">💧</div>
                <div>
                  <div className="label">HUMIDITY</div>
                  <div className="value">
                    {weather.relative_humidity_2m} <small>%</small>
                  </div>
                </div>
              </div>

              <div className="weather-card">
                <div className="icon">🧭</div>
                <div>
                  <div className="label">WIND DIRECTION</div>
                  <div className="value">
                    {weather.wind_direction_10m}°
                  </div>
                </div>
              </div>

            </div>

            {forecast && (
              <section className="forecast-section">
                <div className="forecast-heading">
                  <h3>🌤️ Five-day forecast</h3>
                  <span>Upcoming weather</span>
                </div>

                <div className="forecast-grid">
                  {forecast.time.map((day, index) => {
                    const info = getWeatherInfo(
                      forecast.weather_code[index]
                    );

                    return (
                      <div className="forecast-card" key={day}>
                        <div className="forecast-day">
                          {getDayName(day, index)}
                        </div>

                        <div className="forecast-icon">
                          {info[1]}
                        </div>

                        <div className="forecast-temp">
                          {Math.round(forecast.temperature_2m_max[index])}°
                          <span>
                            {" "}{Math.round(forecast.temperature_2m_min[index])}°
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </section>
            )}

            <div className="updated">
              Weather reading: {weather.time.replace("T", " ")}
            </div>

          </section>
        )}
      </section>

      <footer className="footer">
        Designed with React, useState and useEffect ♡
        <br />
        Weather information provided by <strong>Open-Meteo</strong>
      </footer>

    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <WeatherDashboard />
);
</script>
</body>
</html>
