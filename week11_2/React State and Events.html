<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// STUDENT CARD COMPONENT

function StudentCard({ name, studentId, major, gpa }) {
  return (
    <article className="student-card">
      <div className="avatar">{name.charAt(0)}</div>
      <h3>{name}</h3>
      <p className="student-id">ID: {studentId}</p>

      <div className="student-info">
        <span>Major</span>
        <strong>{major}</strong>
      </div>

      <div className="student-info">
        <span>GPA</span>
        <strong>{gpa || "Not provided"}</strong>
      </div>
    </article>
  );
}

// E1: COUNTER

function CounterExercise() {
  const [count, setCount] = useState(0);

  return (
    <div className="demo">
      <div className="counter">{count}</div>
      <div className="btn-row">
        <button className="btn secondary"
          onClick={() => setCount(c => c - 1)}>
          Decrease
        </button>
        <button className="btn primary"
          onClick={() => setCount(c => c + 1)}>
          Add one
        </button>
        <button className="btn danger"
          onClick={() => setCount(0)}>
          Reset
        </button>
      </div>
    </div>
  );
}

// E2: CONTROLLED INPUT

function InputExercise() {
  const [name, setName] = useState("");

  return (
    <div className="demo">
      <label className="field-label" htmlFor="name-preview">
        Your name
      </label>
      <input
        id="name-preview"
        className="field"
        value={name}
        onChange={e => setName(e.target.value)}
        placeholder="Type your name..."
        maxLength={50}
      />
      <div className="preview">
        <small>LIVE PREVIEW</small>
        <strong>Hello, {name.trim() || "there"}!</strong>
      </div>
    </div>
  );
}

// E3: ADD AND REMOVE LIST ITEMS

function ListExercise() {
  const [items, setItems] = useState([
    {id: 1, text: "Finish the Git practice"},
    {id: 2, text: "Revise CSS flexbox"},
    {id: 3, text: "Submit the week 11 page"}
  ]);

  const [input, setInput] = useState("");
  const [nextId, setNextId] = useState(4);

  function handleSubmit(e) {
    e.preventDefault();
    const text = input.trim();
    if (!text) return;

    setItems(current => [
      ...current,
      {id: nextId, text}
    ]);
    setNextId(id => id + 1);
    setInput("");
  }

  function removeItem(id) {
    setItems(current => current.filter(item => item.id !== id));
  }

  return (
    <div className="demo">
      <form onSubmit={handleSubmit} className="add-row">
        <input
          className="field"
          value={input}
          onChange={e => setInput(e.target.value)}
          placeholder="Add a new item..."
          aria-label="New list item"
        />
        <button className="btn primary" type="submit">Add</button>
      </form>

      <div className="list">
        {items.length === 0 && (
          <p className="progress-text">No items yet. Add one above.</p>
        )}
        {items.map(item => (
          <div className="list-row" key={item.id}>
            <span>{item.text}</span>
            <button
              className="remove"
              onClick={() => removeItem(item.id)}
              aria-label={`Remove ${item.text}`}
            >
              Remove
            </button>
          </div>
        ))}
      </div>
    </div>
  );
}

// E4: SHOW AND HIDE CONTENT

function ToggleExercise() {
  const [visible, setVisible] = useState(true);

  return (
    <div className="demo">
      <button
        className="btn primary"
        aria-expanded={visible}
        onClick={() => setVisible(v => !v)}
      >
        {visible ? "Hide details" : "Show details"}
      </button>

      {visible && (
        <div className="details-panel">
          State lets React update just the part of the interface
          that changed. A boolean value controls whether this
          content is displayed.
        </div>
      )}
    </div>
  );
}

// E5: TASK FILTERING

function TaskExercise() {
  const [tasks, setTasks] = useState([
    {id: 1, text: "Push the project to GitHub", done: true},
    {id: 2, text: "Rebuild the dist folder", done: false},
    {id: 3, text: "Check the live link", done: false}
  ]);

  const [filter, setFilter] = useState("All");

  const filtered = tasks.filter(task => {
    if (filter === "Active") return !task.done;
    if (filter === "Done") return task.done;
    return true;
  });

  const completed = tasks.filter(task => task.done).length;

  function toggle(id) {
    setTasks(current =>
      current.map(task =>
        task.id === id
          ? {...task, done: !task.done}
          : task
      )
    );
  }

  function clearCompleted() {
    setTasks(current => current.filter(task => !task.done));
  }

  return (
    <div className="demo">
      <p className="progress-text">
        {completed} of {tasks.length} tasks completed
      </p>

      <div className="filters">
        {["All", "Active", "Done"].map(option => (
          <button
            key={option}
            className={`filter ${filter === option ? "active" : ""}`}
            onClick={() => setFilter(option)}
          >
            {option}
          </button>
        ))}
      </div>

      {filtered.length === 0 && (
        <p className="progress-text">No tasks to display.</p>
      )}

      {filtered.map(task => (
        <label
          className={`task-row ${task.done ? "done" : ""}`}
          key={task.id}
        >
          <input
            type="checkbox"
            checked={task.done}
            onChange={() => toggle(task.id)}
          />
          <span>{task.text}</span>
        </label>
      ))}

      <button
        className="btn secondary"
        onClick={clearCompleted}
        style={{marginTop: 8}}
      >
        Clear completed
      </button>
    </div>
  );
}

// E6: CONTROLLED FORM

function FormExercise() {
  const [form, setForm] = useState({
    name: "",
    email: ""
  });

  const [message, setMessage] = useState("");

  function handleSubmit(e) {
    e.preventDefault();

    if (!form.name.trim() || !form.email.trim()) {
      setMessage("Please fill in both fields.");
      return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) {
      setMessage("Please enter a valid email address.");
      return;
    }

    setMessage(`Profile saved successfully for ${form.name}!`);
    setForm({name: "", email: ""});
  }

  return (
    <div className="demo">
      <form onSubmit={handleSubmit}>
        <label className="field-label" htmlFor="profile-name">
          Name
        </label>
        <input
          id="profile-name"
          className="field"
          value={form.name}
          onChange={e => setForm({...form, name: e.target.value})}
          placeholder="Enter your name"
          maxLength={60}
        />

        <label className="field-label" htmlFor="profile-email">
          Email
        </label>
        <input
          id="profile-email"
          className="field"
          type="email"
          value={form.email}
          onChange={e => setForm({...form, email: e.target.value})}
          placeholder="Enter your email"
        />

        <button className="btn primary" type="submit">
          Save profile
        </button>
      </form>

      {message && (
        <div
          className={`message ${
            message.includes("successfully") ? "ok" : "error"
          }`}
          role="status"
        >
          {message}
        </div>
      )}
    </div>
  );
}

// E7: LOCAL STORAGE AND USEEFFECT

function NotesExercise() {
  const [note, setNote] = useState(
    () => localStorage.getItem("week11-quick-note") || ""
  );

  const [saved, setSaved] = useState(false);

  useEffect(() => {
    localStorage.setItem("week11-quick-note", note);
    setSaved(true);

    const timer = setTimeout(() => setSaved(false), 1200);
    return () => clearTimeout(timer);
  }, [note]);

  return (
    <div className="demo">
      <label className="field-label" htmlFor="quick-note">
        Quick note
      </label>
      <textarea
        id="quick-note"
        className="field"
        rows="5"
        style={{resize: "vertical"}}
        value={note}
        onChange={e => setNote(e.target.value)}
        placeholder="Write something you want to remember..."
        maxLength={2000}
      />

      <p className="note-status" aria-live="polite">
        {saved
          ? "✓ Saved in this browser."
          : "Saved in this browser. Refresh the page and it will still be here."}
      </p>
    </div>
  );
}
